<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Textarea</title>
</head>
<body>
    <form action="">
        <h2 class="title">Formulario de contacto</h2>
        <div class="form-input">
            <label for="name">Nombre Completo</label>
            <input id="name" type="text" placeholder="Rodolfo Amarantos">
        </div>
        <div class="form-input">
            <label for="email">Correo Electrónico</label>
            <input id="email" type="email" placeholder="ejemplo@gmail.com">
        </div>
        <div class="form-input">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" rows="8" placeholder="Deja tu Mensaje......"></textarea>
        </div>
        <div class="form-input">
            <label>Acepto términos y condiciendos
                <input type="checkbox" class="checkbox">
            </label>
        </div>
        <div>
            <input class="form-input btn" type="submit" placeholder="enviar">
        </div>
    </form>
</body>
</html>
