<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>select, datalist, option</title>
</head>
<body>
    <form action="">
        <h2 class="title">Formulario de contacto</h2>
        <fieldset>
            <legend>INFORMACIÓN BÁSICA</legend>
            <div class="form-input">
                <label for="name">Nombre Completo</label>
                <input id="name" type="text" placeholder="Rodolfo Amarantos">
            </div>
            <div class="form-input">
                <label for="email">Correo Electrónico</label>
                <input id="email" type="email" placeholder="ejemplo@gmail.com">
            </div>
            <div class="form-input">
                <label for="email">Asunto</label>
                <input id="asunto" type="text" placeholder="el asunto del mensaje">
            </div>
        </fieldset>
        <div class="form-input">
            <label for="type-of-user">Tipo de Usuario</label>
            <select name="type-of-user" id="type-of-user">
                <option value="useradmin">admin</option>
                <option value="userCEO">CEO</option>
                <option value="userworker">worker</option>
            </select>
        </div>
        <div class="form-input">
            <label for="type-of-user">Referente</label>
            <input name="referente" list="referente">
            <datalist id="referente">
                <option value="user1">Empresa</option>
                <option value="user2">Seguidor</option>
                <option value="user3">Comprador</option>
            </datalist>
        </div>
        <div class="form-input">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" rows="8" placeholder="Deja tu Mensaje......"></textarea>
        </div>
        <div class="form-input">
            <label>Acepto <a href="terms.html" target="_blank">términos y condiciendos</a>
                <input type="checkbox" class="checkbox">
            </label>
        </div>
        <div>
            <input class="form-input btn" type="submit" placeholder="enviar">
        </div>
    </form>
</body>
</html>
