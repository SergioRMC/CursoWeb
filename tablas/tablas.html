<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tablas</title>
</head>
<body>
    <table>
        <thead>
            <tr>
            <th>Producto</th>
            <th>Supermercado</th>
            <th>Precio</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td>Banana</td>
                <td>Mercadona</td>
                <td>5$</td>
            </tr>
            <tr>
                <td>Melon</td>
                <td>Lidel</td>
                <td>7$</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>TOTAL</th>
                <td colspan="2">12$</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
